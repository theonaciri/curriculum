<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · Page introuvable · Página no encontrada — Théo Naciri</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a111e" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
      .not-found {
        display: grid;
        place-items: center;
        min-height: 100svh;
        padding: 48px var(--gutter);
        text-align: center;
      }
      .not-found .brand {
        margin: 0 0 40px;
      }
      .not-found__code {
        font: italic 400 clamp(7rem, 26vw, 14rem) / 0.85 var(--font-serif);
        letter-spacing: -0.04em;
        color: var(--accent);
      }
      .not-found h1 {
        margin-top: 22px;
        font: 400 clamp(1.9rem, 4.4vw, 2.8rem) / 1.1 var(--font-serif);
      }
      .not-found__fr {
        margin-top: 6px;
        font: italic 400 clamp(1.4rem, 3vw, 1.9rem) / 1.2 var(--font-serif);
        color: var(--ink-2);
      }
      .not-found__links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 34px;
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div>
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">TN</span>
          <span class="brand__name">Théo Naciri</span>
        </a>
        <p class="not-found__code" aria-hidden="true">404</p>
        <h1>This page doesn’t exist.</h1>
        <p class="not-found__fr" lang="fr">Cette page n’existe pas.</p>
        <p class="not-found__fr" lang="es">Esta página no existe.</p>
        <div class="not-found__links">
          <a class="btn btn--primary" href="/">Back to the home page</a>
          <a class="btn btn--ghost" href="/fr/" lang="fr">Retour à l’accueil</a>
          <a class="btn btn--ghost" href="/es/" lang="es">Volver al inicio</a>
        </div>
      </div>
    </main>
  </body>
</html>
